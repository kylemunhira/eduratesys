{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="topbar"><h1 class="page-title">{{ title }}</h1></div>
<div class="card-panel" style="max-width:640px">
  <form method="post">{% csrf_token %}{{ form|crispy }}
    <button class="btn btn-dark" type="submit">Save</button>
    <a class="btn btn-link" href="{% url 'branch_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
