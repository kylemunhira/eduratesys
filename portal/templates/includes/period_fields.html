<div class="col-auto">
  <label class="form-label form-label-sm mb-0">Period</label>
  <select name="period" class="form-select form-select-sm">
    <option value="today" {% if period == "today" %}selected{% endif %}>Today</option>
    <option value="7d" {% if period == "7d" %}selected{% endif %}>Last 7 days</option>
    <option value="30d" {% if period == "30d" %}selected{% endif %}>Last 30 days</option>
    <option value="month" {% if period == "month" %}selected{% endif %}>This month</option>
    <option value="custom" {% if period == "custom" %}selected{% endif %}>Custom range</option>
  </select>
</div>
<div class="col-auto">
  <label class="form-label form-label-sm mb-0">From</label>
  <input type="date" name="date_from" class="form-control form-control-sm" value="{{ date_from }}">
</div>
<div class="col-auto">
  <label class="form-label form-label-sm mb-0">To</label>
  <input type="date" name="date_to" class="form-control form-control-sm" value="{{ date_to }}">
</div>
